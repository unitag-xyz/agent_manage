[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-remote"
dynamic = ["version"]
description = "Local agent management script for OpenClaw servers."
requires-python = ">=3.10"

[project.optional-dependencies]
server = ["aiohttp>=3.13,<4", "cryptography>=46,<47"]

[tool.setuptools.dynamic]
version = {attr = "agent_manage.__version__"}

[tool.setuptools.package-data]
agent_manage = ["common_skills/*/SKILL.md", "common_skills/*/agents/*.yaml"]
"agent_manage.adapters.openclaw.v2026_7" = ["*.mjs"]

[project.scripts]
agent-manage = "agent_manage.cli:main"
